</div>
<div>
<p class="font-label-md text-label-md text-on-surface">Alex Mercer</p>

</div>

<!-- Main Content Canvas -->
<main class="lg:ml-64 min-h-screen flex flex-col items-center justify-center p-6 md:p-margin-desktop">
<!-- Header Controls (Subtle) -->

<span class="font-label-md text-label-md uppercase tracking-widest text-primary">Cancel</span>
</button>
<div class="flex items-center gap-stack-sm">
<button class="w-10 h-10 flex items-center justify-center text-primary hover:bg-surface-container transition-colors rounded-full">
<span class="material-symbols-outlined">flash_on</span>
</button>
<button class="px-6 py-2 bg-primary text-on-primary font-label-md text-label-md rounded-full hover:opacity-90 transition-opacity">
                    POST
                </button>
</div>
</div>
<!-- Creator Studio Workspace -->
<div class="w-full max-w-4xl flex flex-col items-center">
<!-- Viewfinder Frame -->
<div class="relative w-full aspect-[4/5] md:max-h-[768px] md:w-auto bg-black rounded-xl overflow-hidden shadow-2xl group">
<!-- Camera Feed Placeholder -->
<img alt="Camera Feed" class="w-full h-full object-cover opacity-90 transition-transform duration-700 group-hover:scale-105" data-alt="A cinematic, shallow depth-of-field view of a minimalist interior space with clean architectural lines and natural sunlight streaming through a large window. The mood is tranquil and sophisticated, with a warm ivory color palette. This represents the premium camera viewfinder experience in a high-end social media creator studio, prioritizing visual clarity and silence." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBoh2Ff047yH2bEK204MZ5Ak8qXxTzMk2PRqNRIqqrVxczLHBea0n5ugjEUm_QinZ7S51Nod69VCpe9NcwyfGE0UYljolmh0lQA6Tl9GtBe4cn6qTQf740iXa52KMCR-jtgWxM0FXlR1QkLK3MtDQVyKWHwRdIWu5x7FOOxtMVKqsGXJyrq5xJa6YRkbPqob5XFHdVbY2bE1jL62iv80jTvziw5uV2IP2ytsMBKh1LbelwnOdcYkyzYH_mcgy6GITRVxV2jangxblYA">
<!-- Viewfinder Overlays -->

<!-- Corner Guides -->

<div class="absolute bottom-4 left-4 w-6 h-6 border-b border-l border-white/40"></div>
<div class="absolute bottom-4 right-4 w-6 h-6 border-b border-r border-white/40"></div>

<div class="absolute inset-0 flex flex-col justify-between p-stack-sm">
<!-- Top Action Row -->
<div class="flex justify-center">
<button class="glass-panel px-4 py-2 rounded-full border border-white/20 flex items-center gap-2 group active:scale-95 transition-all">
<span class="material-symbols-outlined text-white text-sm">music_note</span>
<span class="font-label-md text-[11px] text-white tracking-widest uppercase">Select Soundtrack</span>
</button>
</div>
<!-- Center Alignment Guide -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center opacity-30">
<div class="w-px h-full bg-white"></div>
<div class="h-px w-full bg-white absolute"></div>
</div>
<!-- Bottom Studio Controls -->
<div class="space-y-stack-sm mb-4">
<!-- Mode Selector -->
<div class="flex justify-center items-center gap-8 text-white/50">
<button class="font-label-md text-[10px] tracking-[0.2em] uppercase transition-all hover:text-white" id="mode-Story" onclick="switchMode('Story')">Story</button>
<button class="font-label-md text-[10px] tracking-[0.2em] uppercase text-white font-bold transition-all border-b border-white pb-1" id="mode-Image" onclick="switchMode('Image')">Image</button>
<button class="font-label-md text-[10px] tracking-[0.2em] uppercase transition-all hover:text-white" id="mode-Reel" onclick="switchMode('Reel')">Reel</button>
</div>
<!-- Main Shutter & Utilities -->
<div class="flex items-center justify-between px-gutter">
<!-- Gallery -->
<button class="w-12 h-12 rounded-lg border-2 border-white/20 overflow-hidden active:scale-90 transition-transform">
<img alt="Gallery Preview" class="w-full h-full object-cover" data-alt="A small, soft-focus preview image for a gallery upload button. The image features a luxury fashion detail, like a silk texture or minimalist jewelry, in high-contrast black and white. It sits within a premium creator studio UI, maintaining the editorial aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuASGLRJQKv1p1ZEkCXJvhihZ2lQHOZALNFoKBa3tKRi2wBT8BVvEaxlbTgmtUGzirJlr6kGv8-6c6z3KwTLmReJqIfMCtGldQbOsjOEaSlJ3SrGtRn10qgVZc1kr4Uec7GmKWsBhmRkTrUzKXdysi3n8ocEz_t56OlFiMhKt2jnhmXffDbc7GP6KJ4T35qvT6GntAxGtSbsYx8WRy8v8x6W5RqJpKVU56eZuUUUH6D3Dmb0Uz0D6xnAnelzOAgylHj2HtaGi1dUjknG">

<!-- Mobile Bottom Navigation (Hidden on Desktop) -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-surface/80 backdrop-blur-xl flex justify-around items-center px-4 border-t border-outline-variant z-50">
<button class="flex flex-col items-center text-secondary">
<span class="material-symbols-outlined">home</span>
</button>
<button class="flex flex-col items-center text-secondary">
<span class="material-symbols-outlined">explore</span>
</button>
<button class="flex flex-col items-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
</button>
<button class="flex flex-col items-center text-secondary">
<span class="material-symbols-outlined">mail</span>
</button>
<button class="flex flex-col items-center text-secondary">
<span class="material-symbols-outlined">person</span>
</button>
</nav>
<script>
        function switchMode(mode) {
            const modes = ['Story', 'Image', 'Reel'];
            modes.forEach(m => {
                const el = document.getElementById(`mode-${m}`);
                if (m === mode) {
                    el.classList.add('text-white', 'font-bold', 'border-b', 'border-white', 'pb-1');
                    el.classList.remove('text-white/50');
                } else {
                    el.classList.remove('text-white', 'font-bold', 'border-b', 'border-white', 'pb-1');
                    el.classList.add('text-white/50');
                }
            });
            
            // Micro-interaction for mode switch
            const viewfinder = document.querySelector('.group img');
            viewfinder.style.filter = 'brightness(0.7) blur(2px)';
            setTimeout(() => {
                viewfinder.style.filter = 'brightness(1) blur(0px)';
            }, 300);
        }

        // Shutter interaction
        const shutter = document.getElementById('shutter');
        shutter.addEventListener('click', () => {
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[100] pointer-events-none opacity-0 transition-opacity duration-75';
            document.body.appendChild(flash);
            
            requestAnimationFrame(() => {
                flash.style.opacity = '1';
                setTimeout(() => {
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 100);
                }, 100);
            });
        });
    </script>
